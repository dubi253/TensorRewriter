[project]
name = "TensorRewriter"
version = "0.1.0"
description = "An Automatic Tensor Rule Synthesizer for Deep Learning Compilers"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["tensor", "compiler", "optimization", "graph-rewrite", "deep-learning", "ai"]
dependencies = [
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tensor_rewriter"]
